name: E2E Tests

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run (on-demand; default is full regression)
        required: true
        default: regression
        type: choice
        options:
          - smoke
          - sanity
          - regression

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev1
    env:
      CI: 'true'
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve suite
        id: suite
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "name=smoke" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo "name=sanity" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "name=${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported event: ${{ github.event_name }}" >&2
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright ${{ steps.suite.outputs.name }}
        run: npm run test:${{ steps.suite.outputs.name }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.suite.outputs.name }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 20
